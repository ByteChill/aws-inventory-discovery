-columns:1fr}.metric{flex-direction:row;align-items:center;justify-content:space-between}.metric>.small{display:none}.heading{flex-direction:column}.picker{left:188px;width:calc(100vw - 200px)}h1{font-size:28px}.toolbar{flex-wrap:wrap}.toolbar input{width:100%;flex-basis:100%}.view-toggle{margin-left:0}.scope-button{padding:10px;font-size:12px}.nav .leaf{padding-left:16px;font-size:12px}.nav .num{margin-left:8px}.scope-option{align-items:flex-start;gap:10px;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){.type-mark,.pill,.nav button.active{border:1px solid currentColor}}
.scope-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:white}.breadcrumb{flex-wrap:wrap}.type-card{gap:10px;padding:16px}.type-card .fields{padding-top:8px}.type-card-head{gap:8px}.type-card h3{font-size:14px}.card-readings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 18px 12px;padding:12px 0;border-top:1px solid #f0ece7;border-bottom:1px solid #f0ece7}.card-readings dt{font-size:12px;color:var(--muted);margin-bottom:6px}.card-readings dd{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere;line-height:1.5}.card-readings .pill{font-weight:500;font-size:12px}.resource-card .card-readings{padding:12px 0}.resource-card .type-attrs{padding-top:0}.heading .pill.off{display:none}
.insights{display:grid;grid-template-columns:1.2fr repeat(3,minmax(0,1fr));gap:14px;margin-bottom:28px}.insight{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;display:flex;flex-direction:column;min-height:192px}.insight.lead{background:var(--soft);border-color:#edd8e0}.insight-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:16px}.insight-value{font-size:28px;font-weight:650;line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-bottom:12px}.insight-value small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}.insight-bottom{font-size:12px;color:var(--muted);margin-top:auto;padding-top:16px}.distribution{margin:0}.distribution>div{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0}.distribution dt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.distribution dd{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap}@media(max-width:1100px){.insights{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.insights{grid-template-columns:1fr}.insight{min-height:auto}.section-heading{flex-wrap:wrap}.insight-label{margin-bottom:10px}}
.environment-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 32px;border-bottom:1px solid var(--line);background:#fbfaf8}.environment-tabs{display:flex;gap:4px}.environment-tabs button{font-size:12px;min-width:62px;border:1px solid transparent;background:transparent;padding:5px 12px}.environment-tabs button.active{background:var(--soft);color:var(--accent);border-color:#e7c6d2;font-weight:600}.environment-help{margin-left:auto}.account-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.account-group{background:white;border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.account-group.active{border-color:#c38a9e}.environment-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:0;padding:0;width:100%;text-align:left;background:transparent}.environment-heading span{font-size:12px;color:var(--muted)}.account-chip{overflow-wrap:anywhere}.account-group .accounts{display:block}.account-group .account-chip{display:block;margin-top:6px;border:0;padding:4px 0;font-size:12px}@media(max-width:1100px){.environment-bar{padding:12px 24px}.environment-help{display:none}}@media(max-width:760px){.environment-bar{padding:12px 16px;gap:8px}.environment-tabs{flex-wrap:wrap}.environment-tabs button{padding:5px 9px;min-width:auto}.account-groups{grid-template-columns:1fr}.resource-foot{flex-wrap:wrap}}

<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>AWS 资源清单</div><div class="scope-wrap"><button class="scope-button" id="scope" aria-haspopup="dialog" aria-expanded="false"></button></div><input class="nav-search" id="type-search" aria-label="查找资源类型" placeholder="查找资源类型"><nav class="nav" id="nav" aria-label="资源类型"></nav><div class="sidebar-foot">只读资源清单<br>当前状态 · 15 种资源类型</div></aside>
<div class="workspace"><header class="topbar"><div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="global-search" aria-label="在当前范围内搜索资源" placeholder="在当前范围内搜索资源"></div><select id="region" aria-label="区域"><option value="">全部区域</option><option>us-east-1</option><option>eu-west-1</option><option>eu-west-2</option></select><span class="small">中文</span></header><div id="environment-bar" class="environment-bar"></div><main class="main" id="main"></main></div>
</div>
<div id="picker" class="picker" role="dialog" aria-label="选择资源范围" hidden></div>
<div id="shade" class="shade" hidden><section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="资源详情"></section></div>
<script src="console-data.js"></script>
<script>
const icons={down:'<path d="m6 9 6 6 6-6"/>',right:'<path d="m9 6 6 6-6 6"/>',box:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5M8 17h3"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',list:'<path d="M4 6h16M4 12h16M4 18h16"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};
const ico=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scope=SCOPES[0],type=null,view='table',pickTab='app',query='',region='',environment='',page=1,selected=null,focusReturn=null;
const collapsed=new Set();
const total=k=>Math.round(TYPES[k].per*scope.n/68);
const scopeTotal=()=>Object.keys(TYPES).reduce((n,k)=>n+total(k),0);
const rawRows=k=>Array.from({length:total(k)},(_,i)=>({...TYPES[k].row(i),index:i,acct:scope.accts[i%scope.accts.length],region:['us-east-1','eu-west-1','eu-west-2'][i%3]}));
const envOf=a=>a.endsWith('-preprod')?'preprod':a.endsWith('-prod')?'prod':'dev';
const ENV_LABELS={dev:'开发',preprod:'预发布',prod:'生产'};
const activeAccounts=()=>scope.accts.filter(a=>!environment||envOf(a)===environment);
const accountCount=()=>!environment&&scope.kind==='all'?20:activeAccounts().length;
const filtered=k=>rawRows(k).filter(r=>(!environment||envOf(r.acct)===environment)&&(!region||r.region===region)&&(!query||[r.name,r.id,r.acct,...r.v.flat()].join(' ').toLowerCase().includes(query.toLowerCase())));
function renderEnvironment(){document.getElementById('environment-bar').innerHTML=`<span class="small">环境</span><div class="environment-tabs" role="group" aria-label="按环境筛选">${[['','全部环境'],['dev','dev'],['preprod','preprod'],['prod','prod']].map(([k,label])=>`<button data-env="${k}" aria-pressed="${environment===k}" class="${environment===k?'active':''}">${label}</button>`).join('')}</div><span class="small environment-help">${environment?ENV_LABELS[environment]+'环境 · '+activeAccounts().length+' 个账号':'开发、预发布与生产'}</span>`}
const display=v=>Array.isArray(v)?`<span class="pill ${v[0]==='off'?'off':''}">${esc(v[1])}</span>`:esc(v||'–');
const kinds=()=>Object.keys(TYPES).filter(k=>filtered(k).length>0);
const PRIMARY={ec2:[0,1],ami:[0,1],lambda:[0,1],vpc:[0,1],subnet:[2,4],sg:[1,2],r53:[0,1],ecsc:[0,2],ecss:[0,2],ecst:[1,2],lb:[0,1],tg:[0,1],sqs:[0,3],sns:[0,1],secret:[0,2]};
function cardReadings(T,r){const indices=PRIMARY[type];return `<dl class="card-readings">${indices.map(i=>`<div><dt>${T.cols[i]}</dt><dd>${display(r.v[i])}</dd></div>`).join('')}</dl><dl class="type-attrs">${T.cols.map((c,i)=>indices.includes(i)?'':`<div class="kv-row"><dt>${c}</dt><dd>${display(r.v[i])}</dd></div>`).join('')}</dl>`}
function renderNav(){const q=document.getElementById('type-search').value.toLowerCase();document.getElementById('nav').innerHTML=`<button data-overview class="${type===null?'active':''}" ${type===null?'aria-current="page"':''}><span>范围概览</span>${ico('grid')}</button>`+GROUPS.map(([g,ks])=>{const keys=ks.filter(k=>TYPES[k].label.toLowerCase().includes(q));if(!keys.length)return '';return `<button class="group" data-group="${g}" aria-expanded="${!collapsed.has(g)}"><span>${ico(collapsed.has(g)?'right':'down')}${g}</span></button>${collapsed.has(g)&&!q?'':keys.map(k=>`<button class="leaf ${type===k?'active':''}" data-type="${k}" ${type===k?'aria-current="page"':''}><span>${TYPES[k].label}</span><span class="num">${filtered(k).length}</span></button>`).join('')}`}).join('')}
function summary(){return `<div class="summary"><article class="metric primary"><span class="muted">${query||region||environment?'匹配资源':'范围内资源'}</span><div class="value">${Object.keys(TYPES).reduce((n,k)=>n+filtered(k).length,0).toLocaleString()}<small>项</small></div><span class="small">按账号与区域分别记录</span></article><article class="metric"><span class="muted">账号</span><div class="value">${accountCount()}<small>个</small></div><span class="small">${environment?environment+' · '+ENV_LABELS[environment]:scope.kind==='app'?'dev · preprod · prod':scope.kind==='acct'?ENV(scope.name):'跨应用浏览'}</span></article><article class="metric"><span class="muted">资源类型</span><div class="value">${kinds().length}<small>种</small></div><span class="small">每种类型有独立属性</span></article></div>`}
function renderOverview(){return `<div class="eyebrow">${scope.kind==='app'?'应用 · EIM '+esc(scope.id):scope.kind==='acct'?'AWS 账号 · '+esc(scope.id):'组织资源'}</div><div class="heading"><div><h1>${esc(scope.name)}</h1><p>从资源类型开始，查看这个范围的当前状态。</p></div><span class="pill off">资源清单</span></div>${summary()}<div class="section-heading"><div><h2>按类型浏览</h2><p>选择一种类型，查看它的资源与属性。</p></div></div><div class="type-grid">${GROUPS.map(([g,ks])=>ks.filter(k=>filtered(k).length).map(k=>`<button class="type-card" data-type="${k}"><div class="type-card-head"><span class="type-mark">${ico('box')}</span><h3>${TYPES[k].label}</h3><span class="count">${filtered(k).length}</span></div><div class="fields"><span>${g}</span> · ${TYPES[k].cols.slice(0,2).join(' · ')}<span style="float:right">${ico('right')}</span></div></button>`).join('')).join('')||'<div class="empty">没有匹配的资源</div>'}</div><div class="scope-context"><h3>按环境查看账号</h3><div class="account-groups">${['dev','preprod','prod'].map(env=>`<section class="account-group ${environment===env?'active':''}"><button class="environment-heading" data-env="${env}" aria-pressed="${environment===env}"><strong>${env}</strong><span>${ENV_LABELS[env]} · ${scope.accts.filter(a=>envOf(a)===env).length} 个账号</span></button><div class="accounts">${scope.accts.filter(a=>envOf(a)===env).map(a=>`<span class="account-chip">${esc(a)}</span>`).join('')||'<span class="small">此范围没有账号</span>'}</div></section>`).join('')}</div></div>`}
function insights(T,R){const distribution=fn=>{const counts=new Map();for(const r of R){const label=fn(r);counts.set(label,(counts.get(label)||0)+1)}return [...counts].sort((a,b)=>b[1]-a[1])};const cards=[...PRIMARY[type].map(index=>({title:T.cols[index],items:distribution(r=>Array.isArray(r.v[index])?r.v[index][1]:String(r.v[index]||'未提供'))})),{title:'区域分布',items:distribution(r=>r.region)}];return `<section class="insights" aria-label="当前类型资源摘要"><article class="insight lead"><div class="insight-label">${T.label}</div><div class="insight-value">${R.length.toLocaleString()}<small>项</small></div><p class="small">${accountCount()} 个账号 · ${new Set(R.map(r=>r.region)).size} 个区域</p><div class="insight-bottom">${esc(scope.name)} · 当前清单</div></article>${cards.map(card=>`<article class="insight"><div class="insight-label">${card.title}</div><div class="insight-value">${['状态','轮换'].includes(card.title)?`${card.items[0]?.[1]||0}<small>${esc(card.items[0]?.[0]||'项')}</small>`:`${card.items.length}<small>${card.title==='区域分布'?'个区域':'种'}</small>`}</div><dl class="distribution">${card.items.slice(0,3).map(([label,n])=>`<div><dt title="${esc(label)}">${esc(label)}</dt><dd>${n} 项</dd></div>`).join('')}</dl>${card.items.length>3?`<p class="small">另有 ${card.items.length-3} 种，详见下方清单</p>`:''}</article>`).join('')}</section>`}
function renderResources(){const T=TYPES[type],all=filtered(type),pages=Math.max(1,Math.ceil(all.length/9));page=Math.min(page,pages);const R=all.slice((page-1)*9,page*9);return `<div class="heading"><div><h1>${T.label}</h1><p>${esc(scope.name)} · ${environment||'全部环境'} · ${region||'全部区域'} · ${all.length} 项资源</p></div><div class="view-toggle" aria-label="资源视图"><button data-view="cards" class="${view==='cards'?'active':''}" aria-pressed="${view==='cards'}">${ico('grid')}卡片</button><button data-view="table" class="${view==='table'?'active':''}" aria-pressed="${view==='table'}">${ico('list')}表格</button></div></div>${insights(T,all)}<div class="section-heading"><h2>资源明细</h2><span class="small">${T.cols.join(' · ')}</span></div><div class="toolbar"><input id="resource-search" aria-label="筛选当前类型资源" placeholder="搜索名称、ID、账号或属性" value="${esc(query)}"><span class="small">${T.cols.slice(0,3).join(' · ')}</span></div>${!R.length?'<div class="empty"><h3>没有匹配的资源</h3><p class="muted">调整环境、区域或搜索内容后重试。</p></div>':view==='cards'?`<div class="resource-grid">${R.map(r=>`<article class="resource-card"><button class="resource-title" data-row="${r.index}" aria-label="查看 ${esc(r.name)}"><h3>${esc(r.name)}</h3><span class="mono">${esc(r.id)}</span></button>${cardReadings(T,r)}<div class="resource-foot"><span>${esc(r.acct)} · ${envOf(r.acct)}</span><span>${esc(r.region)}</span></div></article>`).join('')}</div>`:`<div class="table-wrap"><table><thead><tr><th>名称 / ${T.idCol}</th>${T.cols.map(c=>`<th>${c}</th>`).join('')}${scope.accts.length>1?'<th>账号</th>':''}<th>环境</th><th>区域</th></tr></thead><tbody>${R.map(r=>`<tr><td><button data-row="${r.index}">${esc(r.name)}<br><span class="mono muted">${esc(r.id)}</span></button></td>${r.v.map(v=>`<td>${display(v)}</td>`).join('')}${scope.accts.length>1?`<td>${esc(r.acct)}</td>`:''}<td>${envOf(r.acct)}</td><td class="mono">${r.region}</td></tr>`).join('')}</tbody></table></div>`}<div class="footer-count"><span>${all.length?`${(page-1)*9+1}–${Math.min(page*9,all.length)} 项，共 ${all.length} 项`:'0 项'}</span><div class="pager"><button data-page="-1" aria-label="上一页" ${page===1?'disabled':''}>${ico('right').replace('class="icon"','class="icon" style="transform:rotate(180deg)"')}</button><span>${page} / ${pages}</span><button data-page="1" aria-label="下一页" ${page===pages?'disabled':''}>${ico('right')}</button></div></div>`}
function render(){renderEnvironment();document.getElementById('scope').innerHTML=`<span><span class="small">${{app:'应用 · EIM',acct:'AWS 账号',all:'组织范围'}[scope.kind]}</span><strong>${esc(scope.name)}</strong></span>${ico('down')}`;renderNav();document.getElementById('main').innerHTML=`<div class="breadcrumb"><span>资源清单</span>${ico('right')}<span class="scope-badge">${scope.kind==='app'?'EIM':scope.kind==='acct'?'账号':'组织'} · ${esc(scope.name)}${scope.id?' · '+esc(scope.id):''}</span><span class="scope-badge">${accountCount()} 个账号 · ${environment||'全部环境'} · ${region||'全部区域'}</span>${type?`${ico('right')}<span>${TYPES[type].label}</span>`:''}</div>`+(type?renderResources():renderOverview())}
function renderPicker(){const picker=document.getElementById('picker');const q=(picker.querySelector('input')?.value||'').toLowerCase();picker.innerHTML=`<div class="tabs" aria-label="范围类别">${[['app','应用 (EIM)'],['acct','账号'],['all','全部']].map(([k,n])=>`<button data-pick-tab="${k}" class="${pickTab===k?'active':''}" aria-pressed="${pickTab===k}">${n}</button>`).join('')}</div><input id="scope-search" aria-label="查找应用或账号" placeholder="输入名称或 ID" value="${esc(q)}"><div id="scope-options"></div>`;renderOptions(q)}
function renderOptions(q){document.getElementById('scope-options').innerHTML=SCOPES.map((s,i)=>({s,i})).filter(({s})=>s.kind===pickTab&&`${s.name} ${s.id}`.toLowerCase().includes(q)).map(({s,i})=>`<button class="scope-option ${s===scope?'active':''}" data-scope="${i}"><span><strong>${esc(s.name)}</strong><span class="small">${esc(s.id||s.sub)}</span></span><span class="small">${s.kind==='app'?s.accts.length+' 个账号':s.kind==='acct'?ENV(s.name):'全部应用'}</span></button>`).join('')||'<p class="muted" style="padding:16px">没有匹配的范围</p>'}
function togglePicker(open){const p=document.getElementById('picker');p.hidden=!open;document.getElementById('scope').setAttribute('aria-expanded',String(open));if(open){pickTab=scope.kind;renderPicker();p.querySelector('input').focus()}else document.getElementById('scope').focus()}
function openDetails(index){const r=rawRows(type)[index],T=TYPES[type];selected=r;focusReturn=document.activeElement;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><span class="small">${T.label} / 资源详情</span><button class="drawer-close" id="close-drawer" aria-label="关闭详情">${ico('close')}关闭</button></div><h2>${esc(r.name)}</h2><p class="muted">${esc(r.acct)} · ${r.region}</p><div class="drawer-id"><div class="small">${T.idCol}</div><div class="mono">${esc(r.id)}</div></div><div class="section-heading"><h3>${T.label}属性</h3></div><dl>${T.cols.map((c,i)=>`<div class="kv-row"><dt>${c}</dt><dd>${display(r.v[i])}</dd></div>`).join('')}</dl><div class="section-heading"><h3>归属</h3></div><dl><div class="kv-row"><dt>账号</dt><dd>${esc(r.acct)}</dd></div><div class="kv-row"><dt>环境</dt><dd>${envOf(r.acct)} · ${ENV(r.acct)}</dd></div><div class="kv-row"><dt>区域</dt><dd class="mono">${r.region}</dd></div></dl>`;document.getElementById('shade').hidden=false;document.body.style.overflow='hidden';document.getElementById('close-drawer').focus()}
function closeDetails(){document.getElementById('shade').hidden=true;document.body.style.overflow='';selected=null;focusReturn?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='shade')return closeDetails();if(!b){if(!e.target.closest('#picker')&&!document.getElementById('picker').hidden)togglePicker(false);return}if(b.id==='scope')return togglePicker(document.getElementById('picker').hidden);if(b.id==='close-drawer')return closeDetails();if(b.hasAttribute('data-env')){environment=b.dataset.env;page=1;render();document.querySelector(`.environment-tabs [data-env="${environment}"]`)?.focus();return}if(b.dataset.pickTab){pickTab=b.dataset.pickTab;document.getElementById('scope-search').value='';return renderPicker()}if(b.dataset.scope!==undefined){scope=SCOPES[+b.dataset.scope];page=1;togglePicker(false);render();return}if(!b.closest('#picker'))document.getElementById('picker').hidden=true;document.getElementById('scope').setAttribute('aria-expanded',String(!document.getElementById('picker').hidden));if(b.dataset.type){type=b.dataset.type;page=1;render();return}if(b.hasAttribute('data-overview')){type=null;page=1;render();return}if(b.dataset.group){collapsed.has(b.dataset.group)?collapsed.delete(b.dataset.group):collapsed.add(b.dataset.group);renderNav();return}if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.row!==undefined)return openDetails(+b.dataset.row);if(b.dataset.page){page+=+b.dataset.page;render();window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('input',e=>{if(e.target.id==='type-search')return renderNav();if(e.target.id==='scope-search')return renderOptions(e.target.value.toLowerCase());if(['global-search','resource-search'].includes(e.target.id)){query=e.target.value;page=1;const id=e.target.id,pos=e.target.selectionStart;document.getElementById('global-search').value=query;render();const input=document.getElementById(id);input?.focus();input?.setSelectionRange(pos,pos)}});
document.getElementById('region').addEventListener('change',e=>{region=e.target.value;page=1;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('shade').hidden)closeDetails();else if(!document.getElementById('picker').hidden)togglePicker(false)}if(e.key==='Tab'&&!document.getElementById('shade').hidden){const buttons=[...document.getElementById('drawer').querySelectorAll('button,a,input,select,[tabindex="0"]')];if(buttons.length===1){e.preventDefault();buttons[0].focus()}}});render();
</script>
</body>
</html>
