# Local environment for `podman compose` (DESIGN 11.1).
#   podman compose up -d                 postgres, redis, moto, fake-aws, migrate, api, worker
#   podman compose run --rm seed         load the demo dataset (20 accounts x 4 regions)
#   podman compose up -d postgres redis  just what the tests need

# Podman injects the host's HTTP(S)_PROXY into containers; keep service-to-service calls direct.
x-no-proxy: &no-proxy
  NO_PROXY: moto,fake-aws,postgres,redis,localhost,127.0.0.1
  no_proxy: moto,fake-aws,postgres,redis,localhost,127.0.0.1

x-app-env: &app-env
  <<: *no-proxy
  DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory
  DATABASE_SCHEMA: inventory
  REDIS_URL: redis://redis:6379/0
  # boto3 reads these natively: EC2, STS and Logs go to moto, Cloud Control and Config to
  # fake-aws. Never set in production.
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_DEFAULT_REGION: ap-east-1
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  # Cloud Control and AWS Config are served by fake-aws (moto cannot preset their results).
  AWS_ENDPOINT_URL_CLOUDCONTROL: http://fake-aws:4567
  AWS_ENDPOINT_URL_CONFIG_SERVICE: http://fake-aws:4567
  ACCOUNT_REGISTRY_URL: http://fake-aws:4567/registry/accounts
  CREDENTIAL_SERVICE_URL: http://fake-aws:4567/credentials
  # Locally, scans are started on demand (they run immediately). The scheduled sweep
  # staggers accounts over ~5.5 hours, which is right for production but not for a demo.
  SWEEP_ENABLED: "false"

x-app-build: &app-build
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: aws-inventory-discovery:dev

x-devtools-build: &devtools-build
  build:
    context: .
    dockerfile: devtools/Dockerfile
  image: aws-inventory-discovery-devtools:dev

services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: aws-inventory-discovery-postgres
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "55432:5432"
    volumes:
      - ./devtools/postgres-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: docker.io/library/redis:7
    container_name: aws-inventory-discovery-redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  moto:
    image: docker.io/motoserver/moto:latest
    container_name: aws-inventory-discovery-moto
    environment:
      # moto ignores ExecutableUsers=self and would list its ~1000 built-in public AMIs in
      # every account and region.
      MOTO_EC2_LOAD_DEFAULT_AMIS: "false"
    ports:
      - "5001:5000"  # host 5000 is taken by macOS AirPlay Receiver

  # Cloud Control, AWS Config, account registry (1) and credential service (2); moto serves
  # EC2, STS and CloudWatch Logs. Wire formats and admin API: devtools/README.md.
  fake-aws:
    <<: *devtools-build
    container_name: aws-inventory-discovery-fake-aws
    environment:
      <<: *no-proxy
      MOTO_ENDPOINT_URL: http://moto:5000
    ports:
      - "4567:4567"
    depends_on:
      - moto

  # One-shot demo seed: `podman compose run --rm seed`
  seed:
    <<: *devtools-build
    container_name: aws-inventory-discovery-seed
    command: ["python", "seed.py", "--reset"]
    environment:
      <<: *no-proxy
      FAKE_AWS_URL: http://fake-aws:4567
      MOTO_ENDPOINT_URL: http://moto:5000
    depends_on:
      - moto
      - fake-aws
    restart: "no"

  migrate:
    <<: *app-build
    container_name: aws-inventory-discovery-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-build
    container_name: aws-inventory-discovery-api
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app-build
    container_name: aws-inventory-discovery-worker
    command: ["python", "-m", "app.cli", "worker"]
    environment: *app-env
    # Overrides the image's HTTP health check: the worker serves no HTTP, so check its heartbeat.
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      moto:
        condition: service_started
      fake-aws:
        condition: service_started
