name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        # Same host ports as compose.yaml: a few tests use the defaults (55432, 56379).
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:55432/inventory
      TEST_REDIS_URL: redis://localhost:56379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Create the schema (same as devtools/postgres-init)
        working-directory: .
        run: psql -v ON_ERROR_STOP=1 -f devtools/postgres-init/01-schema.sql
        env:
          PGHOST: localhost
          PGPORT: "55432"
          PGUSER: inventory
          PGPASSWORD: inventory
          PGDATABASE: inventory
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --junitxml=test-results/junit.xml
      - name: Test summary
        if: ${{ !cancelled() }}
        run: python3 -I ../.github/scripts/junit_summary.py "Backend tests" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

  devtools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devtools
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --junitxml=test-results/junit.xml
      - name: Test summary
        if: ${{ !cancelled() }}
        run: python3 -I ../.github/scripts/junit_summary.py "Devtools tests" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx biome check .
      - run: npm run build

  e2e:
    needs: [backend, devtools, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack (the api image also builds the dashboard)
        run: docker compose up -d --build
      - name: Wait for the api
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/aws-inventory/api/v1/health && exit 0
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=100
          exit 1
      - name: Seed the demo data
        run: docker compose run --rm seed
      - name: Install dependencies and the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the e2e tests (the global setup runs a full scan first)
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8000/aws-inventory/
      - name: Test summary
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: python3 -I ../.github/scripts/junit_summary.py "E2E tests (Playwright)" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
